name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: test/e2e
        run: npm ci && npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: test/e2e
        run: bash run.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test/e2e/test-results/
          retention-days: 7

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check Nix package build
        run: ./scripts/check-nix-build.sh

  release:
    needs: [test, e2e, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build-all VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} DATE=$(date -u +%Y-%m-%d)

      - name: Generate checksums
        working-directory: dist
        run: sha256sum crit-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/crit-*
            dist/checksums.txt

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          SHA_DARWIN_ARM64=$(sha256sum dist/crit-darwin-arm64 | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(sha256sum dist/crit-darwin-amd64 | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(sha256sum dist/crit-linux-amd64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum dist/crit-linux-arm64 | cut -d' ' -f1)

          BASE_URL="https://github.com/sho-hata/crit/releases/download/${TAG}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sho-hata/homebrew-tap.git" homebrew-tap
          mkdir -p homebrew-tap/Formula

          cat > homebrew-tap/Formula/fcrit.rb <<FORMULA
          class Fcrit < Formula
            desc "Fork of crit with Go LSP code intelligence in diffs"
            homepage "https://github.com/sho-hata/crit"
            version "${VERSION}"
            license "MIT"

            # Installs the same \`crit\` binary as homebrew-core's upstream formula.
            conflicts_with "crit", because: "both install a \`crit\` binary"

            on_macos do
              on_arm do
                url "${BASE_URL}/crit-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "${BASE_URL}/crit-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/crit-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "${BASE_URL}/crit-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              binary = Dir["crit-*"].first || "crit"
              bin.install binary => "crit"
            end

            test do
              output = shell_output("#{bin}/crit --version").strip
              assert_match "${VERSION}", output
              # Guards against the upstream homebrew-core binary being picked up.
              assert_match "sho-hata/crit", output
            end
          end
          FORMULA

          cd homebrew-tap
          git add Formula/fcrit.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update fcrit to ${TAG}"
          git push origin main

      - name: Sync Claude Code plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PLUGIN=integrations/claude-code/.claude-plugin/plugin.json

          git fetch origin main
          git checkout -B main origin/main

          if [ "$(jq -r .version "$PLUGIN")" = "$VERSION" ]; then
            echo "plugin.json already at ${VERSION}"
            exit 0
          fi

          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' "$PLUGIN" > "$tmp"
          mv "$tmp" "$PLUGIN"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$PLUGIN"
          git commit -m "chore(plugin): sync Claude Code plugin version to ${TAG}"
          git push origin main
