version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Skip versions published in the last week: compromised releases are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
