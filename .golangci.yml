version: "2"

linters:
  default: none
  enable:
    - govet
    - gocyclo
    - ineffassign
    - misspell
    - staticcheck
    - nilerr
    - gocritic
    - errorlint
    - unparam
    - perfsprint
    - modernize
    - forbidigo
  settings:
    gocyclo:
      min-complexity: 15
    forbidigo:
      forbid:
        - pattern: '^exec\.Command(Context)?$'
          msg: "spawn language servers and their helpers through sandbox.Jail (see internal/lsp/manager.go)"
        - pattern: '^os\.StartProcess$'
          msg: "spawn language servers and their helpers through sandbox.Jail (see internal/lsp/manager.go)"
        - pattern: '^syscall\.(Exec|ForkExec|StartProcess)$'
          msg: "spawn language servers and their helpers through sandbox.Jail (see internal/lsp/manager.go)"
  exclusions:
    rules:
      # Only internal/lsp is held to the single spawn door; the rest of the
      # tree runs git, gh and the like directly.
      - linters: [forbidigo]
        path-except: '^internal/lsp/'
      # Its tests spawn helpers of their own (a fake server, a child meant
      # to outlive it); only the product code must go through the Jail.
      - linters: [forbidigo]
        path: '_test\.go$'
      - linters: [staticcheck]
        text: "QF"
      # perfsprint's error-format (fmt.Errorf → errors.New on static strings)
      # is style churn with zero perf value; the format/integer/hex/concat
      # checks it also runs are the ones that buy real ns/op and allocs.
      - linters: [perfsprint]
        text: "error-format"
      - linters: [gocyclo]
        text: "runComment|mergeExternalCritJSON|bulkAddCommentsToCritJSONScoped|runPush|runServe|runDesign|handleFileComments"
      - linters: [gocyclo]
        path: "_test\\.go"
      - linters: [gocyclo]
        path: "node_modules/"
      - linters: [unparam]
        path: "_test\\.go"
      - linters: [nilerr, gocritic, errorlint, unparam, govet]
        path: "node_modules/"

formatters:
  enable:
    - gofmt
